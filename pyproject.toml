[project]
name = "universal-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mkrejp", email = "marek.krejpsky@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp",
    "httpx",
]

[project.scripts]
run-mcp = "server:mcp.run"

[build-system]
requires = ["setuptools>=68"]
